# ビットコイン投資戦略 - 毎日自動分析ワークフロー
# 毎朝9時（日本時間）に自動実行し、結果をXSERVERにアップロードします
# 実行前にX APIで最新の#ビットコイン投稿を取得してPineconeに保存
# keepalive ジョブが毎回ワークフローを re-enable し、
# 「60日間リポジトリ活動なしでスケジュール実行が自動停止」される仕様を回避する

name: Daily BTC Analysis

on:
  # 毎日0:00 UTC（日本時道9:00）に実行
  schedule:
    - cron: '0 0 * * *'
  
  # 手動実行も可能
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Tokyo'

jobs:
  # 60日無活動によるスケジュール自動停止を防ぐ（enable API 呼び出しでタイマーがリセットされる）
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily_analysis.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # メイン分析を実行
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          # OpenAI API
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=gpt-4o
          
          # Pinecone
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=bitcoin
          
          # Twitter/X API（Pinecone同期用）
          TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_TARGET_USERNAME=DriftSeiya
          
          # News & Market Data APIs
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }}
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY=${{ secrets.FRED_API_KEY }}
          
          # XSERVER FTP
          XSERVER_FTP_HOST=${{ secrets.XSERVER_FTP_HOST }}
          XSERVER_FTP_PORT=21
          XSERVER_FTP_USER=${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD=${{ secrets.XSERVER_FTP_PASSWORD }}
          XSERVER_REMOTE_DIR=${{ secrets.XSERVER_REMOTE_DIR }}
          XSERVER_PUBLIC_URL=${{ secrets.XSERVER_PUBLIC_URL }}
          
          # 実行設定
          TIMEZONE=Asia/Tokyo
          LOG_LEVEL=INFO
          EOF

      - name: Create directories
        run: mkdir -p logs data

      - name: Download sync state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tweet-sync-state
          path: data/

      - name: Sync latest X posts to Pinecone
        run: |
          echo "📥 最新のX投稿を取得してPineconeに同期..."
          # X API Free Tier: 月100件制限のため2件に制限（月30日×2件=60件/月）
          python scripts/sync_tweets_to_pinecone.py --max-tweets 2
          
          if [ -f data/tweet_sync_state.json ]; then
            echo ""
            echo "同期状態:"
            cat data/tweet_sync_state.json
          fi

      - name: Upload sync state
        uses: actions/upload-artifact@v4
        with:
          name: tweet-sync-state
          path: data/tweet_sync_state.json
          retention-days: 90
          overwrite: true

      - name: Run BTC Analysis
        run: python scripts/run_analysis.py
        timeout-minutes: 15

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-results-${{ github.run_number }}
          path: |
            data/latest_prediction.json
            logs/
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "## ✅ BTC分析が完了しました" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 実行時刻: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_STEP_SUMMARY
          echo "- 結果ページ: ${{ secrets.XSERVER_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # X投稿同期サマリー
          if [ -f data/tweet_sync_state.json ]; then
            SYNCED=$(python -c "import json; d=json.load(open('data/tweet_sync_state.json')); print(d.get('total_synced_count', 0))")
            MONTHLY=$(python -c "import json; d=json.load(open('data/tweet_sync_state.json')); print(d.get('monthly_api_calls', 0))")
            echo "### 📥 X投稿同期" >> $GITHUB_STEP_SUMMARY
            echo "- Pinecone内投稿数: **$SYNCED** 件" >> $GITHUB_STEP_SUMMARY
            echo "- 月間API使用: **$MONTHLY** / 100" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f data/latest_prediction.json ]; then
            echo "### 予測サマリー" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            head -50 data/latest_prediction.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Failure notification
        if: failure()
        run: |
          echo "## ❌ BTC分析が失敗しました" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ログを確認してください。" >> $GITHUB_STEP_SUMMARY
